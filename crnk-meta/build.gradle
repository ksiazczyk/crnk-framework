apply plugin: 'java'

dependencies {
	compile project(':crnk-core')
	compileOnly project(':crnk-client')

	testCompile project(':crnk-client')
	testCompile project(':crnk-setup:crnk-setup-rs')
	testCompile project(':crnk-test')
}
