# ---docerion
# type: config
# title: Docerion graph configuration
# summary: Scope, vocabulary and mapping rules of the documentation graph of this repository.
# ---
format: docerion/1
vocab:
  node_types:
    readme: { label: README }
    guide: { label: Guide, description: "How-to pages and tutorials." }
    reference: { label: Reference, description: "Reference documentation, API descriptions and specifications." }
    decision: { label: Decision, status: [proposed, accepted, rejected, superseded], style: { shape: diamond } }
    note: { label: Note, description: "Notes, meeting notes and research." }
    plan: { label: Plan }
    changelog: { label: Changelog }
    config: { label: Configuration }
    source: { label: Source code }
    test: { label: Test }
    script: { label: Script }
    data: { label: Data }
    asset: { label: Asset, description: "Images, fonts, media and other binary files." }
    ci: { label: CI and automation }
  edge_types:
    depends_on: { label: depends on, inverse: dependency_of, impact: backward, acyclic: warn }
    implements: { label: implements, inverse: implemented_by, impact: backward }
    documents: { label: documents, inverse: documented_by, impact: backward }
    configures: { label: configures, inverse: configured_by, impact: forward }
    tests: { label: tests, inverse: tested_by, impact: backward }
    part_of: { label: part of, inverse: has_part, impact: forward, acyclic: error }
    supersedes: { label: supersedes, inverse: superseded_by, impact: none, from: [decision], to: [decision], acyclic: error }
    references: { label: references, inverse: referenced_by, impact: none }
    relates_to: { label: relates to, symmetric: true, impact: none }
