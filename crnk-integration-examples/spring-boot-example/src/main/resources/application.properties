# ---docerion
# type: config
# title: application.properties
# summary: Spring Boot configuration for the crnk integration example, setting the API path prefix, default page limit, JPA exposure, security, and Hibernate SQL logging.
# ---

crnk.path-prefix=/api
crnk.default-page-limit=10
crnk.jpa.exposeAll=false
crnk.security.enabled=false

logging.level.org.hibernate.SQL=DEBUG