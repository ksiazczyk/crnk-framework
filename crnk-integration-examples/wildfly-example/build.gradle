// ---docerion
// type: config
// title: build.gradle
// summary: Configures the Gradle build for the Wildfly example WAR and declares the project dependencies used at compile time.
// ---

apply plugin: 'war'

war {
	archiveName = "example.war"
}

dependencies {

	compile project(':crnk-setup:crnk-setup-rs')
	compile project(':crnk-setup:crnk-setup-cdi')
	compile project(':crnk-home')
	compile project(':crnk-data:crnk-data-jpa')

	compileOnly 'javax:javaee-api:7.0'

}
