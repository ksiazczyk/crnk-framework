# ---docerion
# type: config
# title: configuration.yml
# summary: Dropwizard configuration file defining the crnk search package, server connector port and logging.
# ---

crnk:
  searchPackage: io.crnkple.dropwizard.simple.domain

server:
  type: simple
  applicationContextPath: /
  adminContextPath: /admin
  connector:
    type: http
    port: 8080

logging:
  level: INFO

  appenders:
    - type: console