// ---docerion
// type: config
// title: build.gradle
// summary: Gradle build configuration that sets the main class and dependencies for the Dropwizard example.
// ---

apply plugin: 'java'

apply plugin: 'application'

mainClassName = "io.crnk.example.dropwizard.simple.DropwizardService"

dependencies {
	compile project(':crnk-setup:crnk-setup-rs')

	compile group: 'io.dropwizard', name: 'dropwizard-core', version: '1.0.0'
}
