// ---docerion
// type: config
// title: build.gradle
// summary: Gradle build configuration for the crnk-testkit module, declaring compile and test dependencies on crnk-core, crnk-client, crnk-test, and crnk-home projects.
// ---

apply plugin: 'java'

dependencies {
	compile project(':crnk-core')
	compile project(':crnk-client')
	testCompile project(':crnk-test')
	testCompile project(':crnk-home')

	compile 'org.assertj:assertj-core:3.9.1'
	compile 'org.apache.httpcomponents:httpclient:4.5.2'
}
