apply plugin: 'java'

dependencies {
    compile project(':crnk-core')
    compile project(':crnk-data:crnk-data-facet')
    compile project(':crnk-meta')
    compileOnly project(':crnk-home')
    testCompile project(':crnk-test')
    testCompile project(':crnk-home')
}

